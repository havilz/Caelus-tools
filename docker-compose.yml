
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: caelus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-caelus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caelus_password}
      POSTGRES_DB: ${DB_NAME:-caelus_cloud_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caelus_user} -d ${DB_NAME:-caelus_cloud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Redis Cache & Task Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: caelus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # MinIO Object Storage (S3-Compatible untuk Dev / Staging)
  # ----------------------------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: caelus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Prometheus Time-Series Observability Service
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: caelus-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Grafana Loki Log Aggregation Service
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: caelus-loki
    restart: unless-stopped
    user: "0"  # jalankan sebagai root agar bisa menulis ke volume
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Database Migration Runner (berjalan sekali, lalu berhenti)
  # ----------------------------------------------------------------------------
  migrate:
    image: ghcr.io/havilz/caelus-migrate:latest
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.migrate
    container_name: caelus-migrate
    restart: "no"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Backend API Service
  # ----------------------------------------------------------------------------
  api:
    image: ghcr.io/havilz/caelus-api:latest
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.api
    container_name: caelus-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      - ALLOWED_VOLUME_ROOTS=${ALLOWED_VOLUME_ROOTS:-/var/lib/caelus/volumes,/opt/caelus/volumes}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./agent/bin:/app/agent/bin:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Background Worker Service
  # ----------------------------------------------------------------------------
  worker:
    image: ghcr.io/havilz/caelus-worker:latest
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.worker
    container_name: caelus-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Frontend UI Service
  # ----------------------------------------------------------------------------
  frontend:
    image: ghcr.io/havilz/caelus-frontend:latest
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/Dockerfile.ui
    container_name: caelus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    depends_on:
      - api
    networks:
      - caelus-network

networks:
  caelus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
