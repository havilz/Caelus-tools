version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: caelus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-caelus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caelus_password}
      POSTGRES_DB: ${DB_NAME:-caelus_cloud_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caelus_user} -d ${DB_NAME:-caelus_cloud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Redis Cache & Task Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: caelus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Database Migration Runner (GHCR Image - berjalan sekali)
  # ----------------------------------------------------------------------------
  migrate:
    image: ghcr.io/havilz/caelus-migrate:latest
    container_name: caelus-migrate
    restart: "no"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=${DB_SSL_MODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # MinIO Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: caelus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Backend REST API (GHCR Image)
  # ----------------------------------------------------------------------------
  api:
    image: ghcr.io/havilz/caelus-api:latest
    container_name: caelus-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=${DB_SSL_MODE:-disable}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Background Worker (GHCR Image)
  # ----------------------------------------------------------------------------
  worker:
    image: ghcr.io/havilz/caelus-worker:latest
    container_name: caelus-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-caelus_user}
      - DB_PASSWORD=${DB_PASSWORD:-caelus_password}
      - DB_NAME=${DB_NAME:-caelus_cloud_db}
      - DB_SSLMODE=${DB_SSL_MODE:-disable}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - caelus-network

  # ----------------------------------------------------------------------------
  # Caelus Frontend UI (GHCR Image)
  # ----------------------------------------------------------------------------
  frontend:
    image: ghcr.io/havilz/caelus-frontend:latest
    container_name: caelus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://${PUBLIC_DOMAIN:-localhost}:8080/api/v1
    depends_on:
      - api
    networks:
      - caelus-network

networks:
  caelus-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
